<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TruthLayer</title>
<style>
:root{
  --bg:#f7f7f8; --panel:#fff; --ink:#1d2330; --muted:#6b7280; --faint:#9ca3af; --line:#e7e8ec; --soft:#f3f4f6;
  --accent:#3156d3; --accent-soft:#eef2fd;
  --red:#c2410c; --red-soft:#fef2ee; --amber:#b7791f; --amber-soft:#fdf6e7; --green:#2f7d55; --green-soft:#ecf6f0;
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none;cursor:pointer} a:hover{text-decoration:underline}
button{font:inherit}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}

/* sidebar: dark */
nav{background:#10141b;color:#c9d1dd;padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
nav .brand{font-weight:700;font-size:16px;padding:0 10px;color:#fff}
nav .client{font-size:13px;color:#8995a7;padding:0 10px 22px}
nav a.link{display:flex;justify-content:space-between;align-items:center;color:#c9d1dd;padding:8px 10px;border-radius:8px;margin:1px 0;text-decoration:none}
nav a.link:hover{background:#1b2230;text-decoration:none} nav a.link.on{background:#24304a;color:#fff;font-weight:600}
nav .count{font-size:12px;color:#fff;background:#c4302b;border-radius:10px;padding:0 7px;font-weight:600}
nav .count:empty{display:none}
nav .settings{margin-top:auto;font-size:12.5px;color:#8995a7;display:grid;gap:10px;padding:0 10px}
nav .settings input{width:100%;margin-top:3px;font-size:13px;padding:5px 8px;background:#1b2230;border:1px solid #2a3446;color:#e6ebf2;color-scheme:dark}

main{padding:36px 44px 80px;max-width:1080px;width:100%}
h1{font-size:24px;margin:0 0 6px;font-weight:650;letter-spacing:-.2px}
h2{font-size:17px;margin:40px 0 4px;font-weight:600}
h3{font-size:15px;margin:0 0 6px;font-weight:600}
.sub{color:var(--muted);margin:0 0 16px}
.lead{font-size:16px;color:var(--muted);margin:0 0 8px;max-width:720px}
.lead b{color:var(--ink);font-weight:600}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:13px} .mono{font-family:var(--mono);font-size:12.5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap} .spacer{flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px}
.grid{display:grid;gap:14px} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 13px;cursor:pointer;color:var(--ink);font-size:14px}
.btn:hover{border-color:#c9ccd3} .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.small{padding:3px 10px;font-size:13px} .btn.quiet{border-color:transparent;background:none;color:var(--muted)} .btn.quiet:hover{color:var(--ink);background:var(--soft)}
.btn.danger{color:var(--red)} .btn:disabled{opacity:.5;cursor:default}
input,select{font:inherit;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:#fff;color:var(--ink)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.d-red{background:var(--red)} .d-amber{background:#e0a33a} .d-gray{background:#c9ccd3} .d-green{background:var(--green)}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:6px;background:var(--soft);color:var(--muted);white-space:nowrap}
.tag.red{background:var(--red-soft);color:var(--red)} .tag.green{background:var(--green-soft);color:var(--green)} .tag.amber{background:var(--amber-soft);color:var(--amber)} .tag.blue{background:var(--accent-soft);color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12.5px;color:var(--muted);font-weight:500;background:#fcfcfd}
tr:last-child td{border-bottom:none}
.tbl{border:1px solid var(--line);border-radius:12px;overflow:auto;background:#fff}
tr.click{cursor:pointer} tr.click:hover td{background:#fafbfc}

/* files */
.files{background:#fff;border:1px solid var(--line);border-radius:12px}
.file{display:grid;grid-template-columns:20px 170px 1fr auto;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.file:last-child{border-bottom:none}
.file .name{font-weight:500}
.file .meta{color:var(--muted);font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file.missing .name{color:var(--muted)}
.file .acts{display:flex;gap:4px}

/* summary cards */
.sum{display:flex;flex-direction:column;cursor:pointer;min-height:190px}
.sum:hover{border-color:#c9ccd3}
.sum .label{font-size:14px;color:var(--muted);font-weight:500}
.sum .big{font-size:34px;font-weight:650;letter-spacing:-.6px;margin:10px 0 2px;line-height:1.1}
.sum .says{color:var(--ink);font-size:14.5px}
.sum .extra{color:var(--muted);font-size:13.5px;margin-top:8px}
.sum .go{margin-top:auto;padding-top:14px;font-size:14px;color:var(--accent)}
.bar{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;margin-top:12px}
.bar>i{display:block;height:100%;background:var(--green)}

/* to-do */
.tabs{display:flex;gap:4px;margin:10px 0 12px}
.tabs button{border:none;background:none;padding:6px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-size:14px}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 0 0 1px var(--line);font-weight:500}
.todo{background:#fff;border:1px solid var(--line);border-radius:12px}
.item{border-bottom:1px solid var(--line)} .item:last-child{border-bottom:none}
.item>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:13px 18px}
.item>summary::-webkit-details-marker{display:none}
.item>summary:hover{background:#fafbfc}
.item .t{flex:1;min-width:0}
.item .who{color:var(--muted)}
.item .chev{color:var(--faint);transition:transform .12s;font-size:18px;line-height:1}
.item[open] .chev{transform:rotate(90deg)}
.item[open]>summary{background:#fafbfc}
.item .body{padding:4px 18px 18px 38px;background:#fafbfc}
.item .detail{margin:0 0 6px;max-width:760px}
.item .next{color:var(--muted);font-size:14px}
.item .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.item.done .t{color:var(--muted)}
details.ev{margin-top:10px} details.ev summary{cursor:pointer;color:var(--accent);font-size:13.5px}
details.ev .tbl{margin-top:8px} details.ev table{font-size:13px}
.more{padding:12px 18px;text-align:center;border-top:1px solid var(--line)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(29,35,48,.25);display:none;z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(780px,100vw);background:var(--bg);box-shadow:-8px 0 30px rgba(0,0,0,.08);transform:translateX(100%);transition:transform .18s ease;z-index:21;overflow:auto}
.drawer.open{transform:none} .scrim.open{display:block}
.drawer .dh{position:sticky;top:0;background:var(--bg);padding:24px 28px 14px;z-index:2;display:flex;align-items:flex-start;gap:12px;border-bottom:1px solid var(--line)}
.drawer .db{padding:20px 28px 48px}
.drawer h3{margin-top:26px}
.x{border:none;background:none;font-size:24px;cursor:pointer;color:var(--muted);line-height:1;padding:2px 6px}

.cmp td.answer{font-weight:600}
.cmp td.bad{background:var(--red-soft);color:var(--red)}
.cmp td.none{color:var(--faint)}
.cmp .star{color:var(--accent);font-size:11px;margin-left:4px}

.cov{display:grid;gap:3px} .cov .c{border-radius:6px;padding:5px 7px;font-size:12px;min-height:46px}
.cov .h{font-size:12px;color:var(--muted);text-align:center;padding:4px}
.cov .c.ok{background:var(--green-soft)} .cov .c.gap{background:var(--red-soft)} .cov .c.at_risk{background:var(--amber-soft)} .cov .c.empty{background:var(--soft)}
.cov .p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .cov .p.blk{color:var(--red)}

.timeline{border-left:2px solid var(--line);margin-left:5px;padding-left:16px;font-size:14px}
.timeline .ev{position:relative;margin-bottom:12px}
.timeline .ev:before{content:"";position:absolute;left:-21px;top:7px;width:8px;height:8px;border-radius:50%;background:#c9ccd3}
.timeline .ev.decision:before{background:var(--accent)}

.drop{border:1.5px dashed #c9ccd3;border-radius:12px;padding:40px;text-align:center;background:#fff}
.dropall{position:fixed;inset:0;background:rgba(49,86,211,.08);border:2px dashed var(--accent);display:none;z-index:40;align-items:center;justify-content:center;font-size:20px;color:var(--accent);font-weight:600}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:50;max-width:560px;font-size:14px}
pre{background:#f3f4f6;color:var(--ink);padding:14px;border-radius:10px;overflow:auto;font-size:12px;max-height:440px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.offer{position:fixed;right:24px;bottom:24px;width:420px;max-width:calc(100vw - 32px);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.14);padding:18px 20px;z-index:45}
.offer h3{margin:0 0 4px} .offer label{display:flex;gap:8px;align-items:flex-start;margin:8px 0;cursor:pointer;font-size:14px}
.offer input{margin-top:4px}
/* company picker */
.companies{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.co{cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:140px}
.co:hover{border-color:#c9ccd3}
.co .nm{font-size:17px;font-weight:600}
.co .meta{color:var(--muted);font-size:13.5px}
.co .stat{margin-top:auto;font-size:13.5px}
.co.new{border-style:dashed;align-items:center;justify-content:center;color:var(--accent)}
/* setup */
.step{display:flex;gap:14px;margin:34px 0 10px}
.step .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
.step h2{margin:2px 0 2px}
.choice{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:10px}
.choice label{display:flex;gap:8px;align-items:flex-start;cursor:pointer;margin:6px 0}
.choice input[type=checkbox]{margin-top:4px}
.why{color:var(--muted);font-size:13px}
.sticky-save{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:24px 0 12px;margin-top:20px}
nav .switch{font-size:12.5px;color:#8995a7;padding:0 10px 18px;margin-top:-16px;display:block}
nav .switch:hover{color:#fff}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
@media (max-width:960px){.app{grid-template-columns:1fr} nav{position:static;height:auto} .g3,.g2{grid-template-columns:1fr} main{padding:20px 16px} .file{grid-template-columns:20px 1fr;}.file .meta,.file .acts{grid-column:2}}
</style>
</head>
<body>
<div class="app">
  <nav>
    <div class="brand">TruthLayer</div>
    <div class="client" id="client">…</div>
    <a class="switch" href="#/" id="switch">⇄ Switch company</a>
    <div id="wsnav">
    <a class="link" data-r="" data-page="">Home <span class="count" id="navCount"></span></a>
    <a class="link" data-r="people" data-page="people" id="navPeople">People</a>
    <a class="link" data-r="system" data-page="system">How it works</a>
    </div>
    <div class="settings" id="wssettings">
      <label>Check dates as of<input type="date" id="asof"></label>
      <label>Your name (for the log)<input id="rev" placeholder="e.g. Sahi"></label>
    </div>
  </nav>
  <main id="main"></main>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer"><div class="dh"><div id="dhead" style="flex:1"></div><button class="x" id="dclose" aria-label="Close">×</button></div><div class="db" id="dbody"></div></aside>
<div class="dropall" id="dropall">Drop to upload</div>
<input type="file" id="pick" multiple hidden>
<div class="toast" id="toast"></div>
<script>
/* ============================================================ helpers */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const api = async (p, o = {}) => { const r = await fetch(p, o); if (!r.ok) throw new Error((await r.text()) || r.statusText); return r.json(); };
const post = (p, body) => api(p, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body || {})});
let WS = null;                                   // the company we're looking at
const wapi = (p, o) => api(`/api/w/${WS}${p}`, o);
const wpost = (p, body) => post(`/api/w/${WS}${p}`, body);
const go = page => { location.hash = `#/c/${WS}/${page || ""}`; };
const toast = m => { const t = $("#toast"); t.innerHTML = m; t.style.display = "block"; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", 4000); };
const num = n => n == null ? "—" : (Math.round(n * 10) / 10).toLocaleString();
const plural = (n, w, p) => `${n} ${n === 1 ? w : (p || w + "s")}`;
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function val(v) {
  if (v == null || v === "") return "—";
  const s = String(v);
  const m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (m) return `${MONTHS[+m[2] - 1]} ${+m[3]}, ${m[1]}`;
  if (/^[A-Z]{4,}$/.test(s)) return s[0] + s.slice(1).toLowerCase();
  return s;
}
const prose = t => esc(String(t || "").replace(/\b(\d{4})-(\d{2})-(\d{2})\b/g, (m, y, mo, d) => `${MONTHS[+mo - 1]} ${+d}, ${y}`));
const shortDate = d => { const m = String(d).match(/^\d{4}-(\d{2})-(\d{2})$/); return m ? `${MONTHS[+m[1] - 1]} ${+m[2]}` : d; };
const when = ts => { const d = new Date(ts); return isNaN(d) ? ts : d.toLocaleString(undefined, {month: "short", day: "numeric", hour: "numeric", minute: "2-digit"}); };
const msg = m => String(m || "").replace(/^\[(critical|warning|info)\] /, "Flagged: ");
const SEV_DOT = {critical: "d-red", warning: "d-amber", info: "d-gray"};
const ATTR_STATUS = {CONFIRMED: ["Systems agree", "green"], SINGLE_SOURCE: ["One system only", ""], CONFLICT: ["Systems disagree", "red"], RESOLVED: ["You decided", "blue"], MISSING: ["Not recorded", ""]};
const ATTR_NAME = {license_number: "License number", license_expiration: "License expires", license_verified: "License last checked", hire_date: "Hire date"};
const attrName = a => ATTR_NAME[a] || a.replace(/_/g, " ").replace(/^./, c => c.toUpperCase());

let S = null, CFG = null, LABELS = {}, ANCHOR = "", CURRENT_DRAWER = null;
let reviewer = ""; try { reviewer = localStorage.getItem("tl_reviewer") || ""; } catch (e) {}
$("#rev").value = reviewer;
$("#rev").onchange = e => { reviewer = e.target.value; try { localStorage.setItem("tl_reviewer", reviewer); } catch (err) {} };

async function boot() {
  if (!CFG || CFG._ws !== WS) { CFG = await wapi("/config"); CFG._ws = WS; }
  S = await wapi("/summary");
  LABELS = Object.fromEntries(Object.entries(CFG.parsed.sources).map(([k, v]) => [k, v.label || k]));
  ANCHOR = S.anchor_label;
  $("#client").textContent = S.client;
  document.title = S.client + " · TruthLayer";
  $("#asof").value = S.as_of;
  $("#navCount").textContent = S.by_severity.critical || "";
  $("#navPeople").textContent = S.entity_label + "s";
}

/* ============================================================ router + drawer */
const routes = {};
async function router() {
  const parts = location.hash.replace(/^#\/?/, "").split("/");   // c/<company>/<page>
  closeDrawer();
  const inWs = parts[0] === "c" && parts[1];
  DROP = inWs ? upload : null;
  WS = inWs ? decodeURIComponent(parts[1]) : null;
  const r = inWs ? (parts[2] || "") : null;
  $("#wsnav").style.display = $("#wssettings").style.display = $("#switch").style.display = inWs ? "" : "none";
  try {
    if (!inWs) { $("#client").textContent = "Single source of truth"; document.title = "TruthLayer"; CFG = null; return await pickerPage(); }
    const info = await wapi("/info");
    document.querySelectorAll("nav a.link").forEach(a => { a.href = `#/c/${WS}/${a.dataset.page}`; a.classList.toggle("on", a.dataset.r === r); });
    if (!info.configured || r === "setup") {
      if (info.configured) await boot(); else $("#wsnav").style.display = $("#wssettings").style.display = "none";
      $("#client").textContent = info.name; return await setupPage(info);
    }
    await boot(); await (routes[r] || routes[""])();
  } catch (e) { $("#main").innerHTML = `<div class="card">Something went wrong: ${esc(e.message)}</div>`; console.error(e); }
}
window.addEventListener("hashchange", router);
async function refresh() { const d = CURRENT_DRAWER; await router(); if (d) await d(); }
function openDrawer(head, body, reopen) {
  $("#dhead").innerHTML = head; $("#dbody").innerHTML = body;
  $("#drawer").classList.add("open"); $("#scrim").classList.add("open");
  CURRENT_DRAWER = reopen || null; bindActions($("#dbody"));
}
function closeDrawer() { $("#drawer").classList.remove("open"); $("#scrim").classList.remove("open"); CURRENT_DRAWER = null; }
$("#dclose").onclick = closeDrawer; $("#scrim").onclick = closeDrawer;
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });

/* ============================================================ uploading & removing files */
let forcedSource = null;
function pickFiles(source) { forcedSource = source || null; $("#pick").click(); }
async function upload(files) {
  if (!files.length) return;
  const fd = new FormData(); [...files].forEach(f => fd.append("files", f));
  if (forcedSource) fd.append("source", forcedSource);
  forcedSource = null;
  toast("Reading files…");
  const res = await wapi("/files", {method: "POST", body: fd});
  await wpost("/process");
  toast(res.map(r => r.ok ? `Added <b>${esc(r.filename)}</b> as ${esc(r.label)} (${r.records} rows)` : `Couldn't read <b>${esc(r.filename)}</b>: ${esc(r.error)}`).join("<br>"));
  refresh();
}
async function removeFile(id, btn) {
  if (!btn.dataset.armed) { btn.dataset.armed = 1; btn.textContent = "Click to confirm"; setTimeout(() => { if (btn.isConnected) { delete btn.dataset.armed; btn.textContent = "Remove"; } }, 4000); return; }
  btn.disabled = true;
  await wapi("/files/" + id, {method: "DELETE"});
  toast("File removed. Everything was re-checked without it.");
  refresh();
}
$("#pick").onchange = e => { upload(e.target.files); e.target.value = ""; };
let dragDepth = 0;
window.addEventListener("dragenter", e => { e.preventDefault(); dragDepth++; $("#dropall").style.display = "flex"; });
window.addEventListener("dragleave", () => { if (--dragDepth <= 0) { dragDepth = 0; $("#dropall").style.display = "none"; } });
window.addEventListener("dragover", e => e.preventDefault());
let DROP = null;   // what dropping files does on the current page
window.addEventListener("drop", e => { e.preventDefault(); dragDepth = 0; $("#dropall").style.display = "none"; forcedSource = null;
  if (DROP) DROP(e.dataTransfer.files); else toast("Open a company first, then drop its files."); });
$("#asof").onchange = async e => { await wapi("/settings", {method: "PUT", headers: {"Content-Type": "application/json"}, body: JSON.stringify({as_of: e.target.value})}); toast("Re-checked everything as of " + val(e.target.value)); refresh(); };

/* ============================================================ HOME */
let todoTab = "open", todoAll = false;
routes[""] = async () => {
  if (!S.records) return emptyState();
  const v = S.views;
  const [files, issues, cred, staff, cov] = await Promise.all([
    wapi("/files"), wapi("/issues"),
    v.includes("credentials") ? wapi("/views/credentials") : null,
    v.includes("staffing") ? wapi("/views/staffing") : null,
    v.includes("coverage") ? wapi("/views/coverage") : null]);
  const gv = v.length ? [] : S.generic_views;
  const [exp, tot] = await Promise.all([gv.includes("expiring") ? wapi("/views/expiring") : null, gv.includes("totals") ? wapi("/views/totals") : null]);
  const cards = (cred ? credCard(cred) : "") + (staff ? staffCard(staff) : "") + (cov ? covCard(cov) : "")
              + (exp ? exp.groups.map((g, i) => expCard(g, i)).join("") : "") + (tot ? tot.groups.map((g, i) => totCard(g, i)).join("") : "");
  const urgent = S.by_severity.critical, open = S.open_issues;

  $("#main").innerHTML = `
    <h1>${esc(S.client)}</h1>
    <p class="lead">${urgent ? `<b>${plural(urgent, "urgent issue")}</b> and ${open - urgent} smaller ones need a look.` : open ? `${plural(open, "item")} to review, nothing urgent.` : "Everything checks out."}
      Below: your files${cards ? ", the answers to your key questions" : ""}, and a to-do list.</p>

    <h2>1. Your files</h2>
    <p class="sub">One file per system. We match the same ${esc(S.entity_label.toLowerCase())}s across them.</p>
    ${filesList(files)}

    ${cards ? `<h2>2. Your questions, answered</h2><p class="sub">Click a card for the details.</p>
      <div class="grid g3">${cards}</div>` : ""}

    <h2>${cards ? "3. " : "2. "}To-do</h2>
    <p class="sub">Things where the systems disagree or something looks wrong. Click one to see why and decide.</p>
    <div id="todo"></div>`;
  $("#main").querySelectorAll("[data-open]").forEach(el => el.onclick = () => DRAWERS[el.dataset.open](el.dataset.arg));
  bindFiles($("#main"));
  renderTodo(issues);
};

function emptyState() {
  $("#main").innerHTML = `<h1>Welcome</h1>
  <p class="lead">Upload the exports from each of your systems. TruthLayer lines up the same people across them, shows where the systems disagree, and makes a short to-do list.</p>
  <div class="drop" style="margin-top:20px"><div style="font-size:17px;font-weight:600;margin-bottom:4px">Drop your files here</div>
    <div class="muted" style="margin-bottom:16px">CSV, Excel or PDF. We recognise which system each one came from.</div>
    <button class="btn primary" onclick="pickFiles()">Choose files</button></div>
  <h2>What we're expecting</h2>${filesList([])}`;
  bindFiles($("#main"));
}

function filesList(files) {
  const active = files.filter(f => f.active);
  return `<div class="files">${Object.entries(CFG.parsed.sources).map(([k, s]) => {
    const f = active.find(x => x.source === k);
    return f ? `<div class="file"><span class="dot d-green"></span><span class="name">${esc(s.label)}</span>
        <span class="meta">${esc(f.filename)} · ${f.row_count} rows · added ${esc(when(f.uploaded_at))}</span>
        <span class="acts"><button class="btn small quiet" data-replace="${k}">Replace</button><button class="btn small quiet danger" data-remove="${f.id}">Remove</button></span></div>`
      : `<div class="file missing"><span class="dot d-gray"></span><span class="name">${esc(s.label)}</span><span class="meta faint">No file yet</span>
        <span class="acts"><button class="btn small" data-replace="${k}">Upload</button></span></div>`;
  }).join("")}
  <div class="file" style="grid-template-columns:1fr auto"><span class="muted small">Tip: you can also drag files anywhere onto this page.</span><button class="btn small primary" data-upload>Upload files</button></div></div>`;
}
function bindFiles(root) {
  root.querySelectorAll("[data-replace]").forEach(b => b.onclick = () => pickFiles(b.dataset.replace));
  root.querySelectorAll("[data-upload]").forEach(b => b.onclick = () => pickFiles());
  root.querySelectorAll("[data-remove]").forEach(b => b.onclick = () => removeFile(b.dataset.remove, b));
}

/* ---------- three summary cards: one number, one sentence */
function credCard(c) {
  const k = c.counts, expired = k.expired || 0, soon = k.expiring || 0, shaky = (k.unverified || 0) + (k.conflict || 0) + (k.missing || 0) + (k.stale || 0);
  const big = expired ? `${expired} expired` : soon ? `${soon} expiring` : "All current";
  return `<div class="card sum" data-open="cred"><div class="label">Licenses</div>
    <div class="big" style="${expired ? "color:var(--red)" : ""}">${big}</div>
    <div class="says">${expired ? `${plural(expired, "person is", "people are")} working with an expired license.` : soon ? `Expiring in the next ${c.warn_days} days.` : `No one is expired or close to it.`}</div>
    <div class="extra">${[soon && expired ? `${soon} more expiring soon` : "", shaky ? `${shaky} to double-check` : "", `${k.valid || 0} fine`].filter(Boolean).join(" · ")}</div>
    <div class="go">See all licenses →</div></div>`;
}
function staffCard(s) {
  if (!s.total_paid) return `<div class="card sum"><div class="label">State staffing report</div>
    <div class="big" style="color:var(--faint)">—</div><div class="says">Upload the payroll file to see this.</div></div>`;
  const ready = s.report_ready_pct ?? 0;
  return `<div class="card sum" data-open="staff"><div class="label">State staffing report</div>
    <div class="big">${ready}%</div>
    <div class="says">of paid hours are ready to report.</div>
    <div class="bar"><i style="width:${ready}%"></i></div>
    <div class="extra">${num(s.total_flagged)} of ${num(s.total_paid)} hours need a check first.</div>
    <div class="go">See hours by week →</div></div>`;
}
function covCard(c) {
  if (!Object.keys(c.facilities).length) return `<div class="card sum"><div class="label">Hospital referrals</div>
    <div class="big" style="color:var(--faint)">—</div><div class="says">Upload the staff schedule to see this.</div></div>`;
  const f = Object.entries(c.facilities), ready = f.reduce((a, [, d]) => a + d.ready, 0), total = f.reduce((a, [, d]) => a + d.total, 0);
  return `<div class="card sum" data-open="cov"><div class="label">Hospital referrals</div>
    <div class="big">${ready} <span style="font-size:20px;color:var(--muted);font-weight:500">of ${total}</span></div>
    <div class="says">shifts this week have a cleared nurse on duty.</div>
    <div class="extra">${f.map(([n, d]) => `${esc(val(n))} ${d.ready}/${d.total}`).join(" · ")}</div>
    <div class="go">See the shift calendar →</div></div>`;
}

/* ---------- to-do: one flat list, most urgent first */
function renderTodo(issues) {
  const order = {critical: 0, warning: 1, info: 2};
  const open = issues.filter(i => i.status === "open").sort((a, b) => order[a.severity] - order[b.severity]);
  const urgent = open.filter(i => i.severity === "critical"), done = issues.filter(i => i.status !== "open");
  const list = todoTab === "urgent" ? urgent : todoTab === "done" ? done : open;
  const shown = todoAll ? list : list.slice(0, 8);
  $("#todo").innerHTML = `<div class="tabs">
      <button class="${todoTab === "open" ? "on" : ""}" data-tab="open">All open (${open.length})</button>
      <button class="${todoTab === "urgent" ? "on" : ""}" data-tab="urgent">Urgent (${urgent.length})</button>
      <button class="${todoTab === "done" ? "on" : ""}" data-tab="done">Done (${done.length})</button></div>
    <div class="todo">${shown.map(i => issueItem(i, false, true)).join("") || `<div class="empty">${todoTab === "done" ? "Nothing decided yet." : "Nothing here."}</div>`}
      ${list.length > shown.length ? `<div class="more"><a id="showall">Show all ${list.length}</a></div>` : ""}</div>
    <div class="row small muted" style="margin-top:10px;gap:16px"><span class="row" style="gap:6px"><span class="dot d-red"></span>Urgent</span><span class="row" style="gap:6px"><span class="dot d-amber"></span>Should check</span><span class="row" style="gap:6px"><span class="dot d-gray"></span>For your info</span></div>`;
  $("#todo").querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { todoTab = b.dataset.tab; todoAll = false; renderTodo(issues); });
  if ($("#showall")) $("#showall").onclick = () => { todoAll = true; renderTodo(issues); };
  bindActions($("#todo"));
}

function issueItem(i, expanded, showWho) {
  const d = i.data || {}, ev = d.evidence || [], open = i.status === "open";
  let acts = "";
  if (!open) acts = `<span class="muted small">${i.status === "auto" ? `Auto-resolved by rule: <b>${esc((d.auto_rule || {}).label || "")}</b>` : i.status === "resolved" ? "Decided" : i.status === "dismissed" ? "Marked as not a problem" : "Noted"}.</span>
                     <button class="btn small" data-act="reopen" data-id="${i.id}">Undo</button>${(i.status === "dismissed" || i.status === "acknowledged") && i.severity !== "critical" ? ` <button class="btn small quiet" data-mkrule="${i.status === "dismissed" ? "dismiss" : "acknowledge"}" data-id="${i.id}">Make it a rule</button>` : ""}`;
  else if (i.rule === "conflict") {
    const by = {};
    ev.forEach(e => (by[e.value] ||= new Set()).add(e.label || LABELS[e.source] || e.source));
    acts = `<span class="small muted">Which is right?</span>` + (d.options || []).map(o => `<button class="btn small" data-act="choose" data-val="${esc(o)}" data-id="${i.id}"
             title="${by[o] ? "Said by " + esc([...by[o]].join(", ")) : ""}">${esc(val(o))}${by[o] ? ` <span class="faint">(${esc([...by[o]].join(", "))})</span>` : ""}</button>`).join("")
         + `<button class="btn small quiet" data-act="acknowledge" data-id="${i.id}">Not sure yet</button>`;
  } else if (i.rule === "match") {
    acts = `<button class="btn small primary" data-act="confirm" data-id="${i.id}">Yes, same person</button>
            <button class="btn small" data-act="reject" data-id="${i.id}">No, different person</button>`;
  } else {
    acts = `<button class="btn small" data-act="acknowledge" data-id="${i.id}">I'll handle it</button>
            <button class="btn small quiet" data-act="dismiss" data-id="${i.id}">Not a problem</button>`;
  }
  const who = showWho && i.entity_name && !i.title.includes(i.entity_name) ? ` <span class="who">· ${esc(i.entity_name)}</span>` : "";
  return `<details class="item ${open ? "" : "done"}" ${expanded ? "open" : ""}>
    <summary><span class="dot ${open ? SEV_DOT[i.severity] : "d-green"}"></span><span class="t">${prose(i.title)}${who}</span><span class="chev">›</span></summary>
    <div class="body">
      <p class="detail">${prose(i.detail)}</p>
      <div class="next">${esc(i.action)}</div>
      ${evidenceTable(ev)}
      <div class="acts">${acts}${showWho && i.entity_key ? `<span class="spacer"></span><a class="small" data-person="${esc(i.entity_key)}">Open ${esc(i.entity_name || i.entity_key)}'s profile →</a>` : ""}</div>
    </div></details>`;
}
function evidenceTable(ev) {
  if (!ev.length) return "";
  return `<details class="ev"><summary>Show the original records (${ev.length})</summary><div class="tbl"><table>
    <tr><th>System</th><th>File</th><th>What it said</th></tr>
    ${ev.map(x => `<tr><td>${esc(x.label || LABELS[x.source] || x.source)}</td><td class="muted">${esc(x.file || "")}, ${esc(x.locator || "")}</td>
      <td>${typeof x.raw === "object" ? Object.entries(x.raw).map(([k, v]) => `<span class="faint">${esc(k.replace(/_/g, " "))}</span> ${esc(v)}`).join(" &nbsp; ") : esc(x.raw)}</td></tr>`).join("")}
    </table></div></details>`;
}
function bindActions(root) {
  root.querySelectorAll("[data-act]").forEach(b => b.onclick = async e => {
    e.stopPropagation(); b.disabled = true;
    try { await wpost(`/issues/${b.dataset.id}/resolve`, {decision: b.dataset.act, value: b.dataset.val || null, reviewer: reviewer || null});
          toast(b.dataset.act === "reopen" ? "Undone" : "Saved"); await refresh();
          if (b.dataset.act === "dismiss" || b.dataset.act === "acknowledge") offerRule(b.dataset.id, b.dataset.act); }
    catch (err) { toast(esc(err.message)); b.disabled = false; }
  });
  root.querySelectorAll("[data-mkrule]").forEach(b => b.onclick = e => { e.preventDefault(); e.stopPropagation(); offerRule(b.dataset.id, b.dataset.mkrule); });
  root.querySelectorAll("[data-person]").forEach(a => a.onclick = e => { e.preventDefault(); e.stopPropagation(); personDrawer(a.dataset.person); });
}

          <tr><th>Role</th><th>Hours paid</th><th>Hours scheduled</th><th>Ready?</th></tr>

              <td>${r.flagged_hours ? `<span class="tag amber">${num(r.flagged_hours)} h to check</span><details class="ev"><summary>Why</summary><div class="small muted" style="margin-top:4px">${r.reasons.map(esc).join("<br>")}</div></details>`

              ${cell.staff.map(p => `<div class="p ${p.blocked.length || p.unverified ? "blk" : ""}">${esc((p.name || "").split(" ")[0])} <span class="faint">${esc(p.role || "")}</span></div>`).join("")}</div>`; }).join("")}`).join("")}

async function personDrawer(key) {
  const d = await wapi("/entities/" + encodeURIComponent(key));
  const e = d.entity, open = d.issues.filter(i => i.status === "open");
  const srcs = Object.keys(CFG.parsed.sources).filter(s => e.sources[s] || Object.values(e.attrs).some(a => a.sources && a.sources[s]));
  const attrs = Object.entries(e.attrs).filter(([k, a]) => a.status !== "MISSING" || ["license_number", "license_expiration"].includes(k));
  const cell = (a, s) => {
    const vals = (a.sources || {})[s];
    if (!vals) return `<td class="none">—</td>`;
    const bad = (a.status === "CONFLICT" || a.status === "RESOLVED") && vals.some(v => v !== a.value);
    return `<td class="${bad ? "bad" : ""}">${vals.map(val).map(esc).join(", ")}${a.authority === s ? `<span class="star" title="Trusted source">★</span>` : ""}</td>`;
  };
  const head = `<h1>${esc(e.display_name)}</h1>
    <div class="muted">${e.status === "verified" ? `${esc(e.key)} · on the ${esc(ANCHOR)}` : `Not on the ${esc(ANCHOR)}`} · ${open.length ? plural(open.length, "thing") + " to check" : "nothing to check"}</div>`;
  const body = `
    ${open.length ? `<h3 style="margin-top:0">To-do</h3><div class="todo">${open.map((i, n) => issueItem(i, n === 0, false)).join("")}</div>` : ""}
    <h3 style="${open.length ? "" : "margin-top:0"}">What each system says</h3>
    <div class="muted small" style="margin:-2px 0 8px">Red means the system disagrees with our answer. ★ marks the system we trust for that field.</div>
    <div class="tbl"><table class="cmp"><tr><th></th><th>Our answer</th>${srcs.map(s => `<th>${esc(LABELS[s])}</th>`).join("")}</tr>
      ${attrs.map(([k, a]) => `<tr><td class="muted">${esc(attrName(k))}</td>
        <td class="answer">${esc(val(a.value))}${a.status === "CONFLICT" || a.status === "RESOLVED" ? `<div><span class="tag ${ATTR_STATUS[a.status][1]}">${ATTR_STATUS[a.status][0]}</span></div>` : ""}</td>
        ${srcs.map(s => cell(a, s)).join("")}</tr>`).join("")}
    </table></div>
    ${hoursTable(d.records)}
    ${d.issues.some(i => i.status !== "open") ? `<h3>Already decided</h3><div class="todo">${d.issues.filter(i => i.status !== "open").map(i => issueItem(i, false, false)).join("")}</div>` : ""}
    <details class="ev" style="margin-top:26px"><summary>History and how records were matched</summary>
      <div class="grid g2" style="margin-top:12px"><div class="tbl"><table><tr><th>System</th><th>How we matched</th></tr>${matchSummary(d.records)}</table></div>
      <div class="card"><div class="timeline">${d.timeline.map(t => `<div class="ev ${t.kind}"><div class="faint small">${esc(when(t.at))}</div>${esc(msg(t.message))}</div>`).join("")}</div></div></div>
    </details>`;
  openDrawer(head, body, () => personDrawer(key));
}
function matchSummary(recs) {
  const M = {anchor: `Their ${ANCHOR} record`, auto: "Automatically", confirmed: "Confirmed by you", review: "Waiting for you to confirm", unverified: "Grouped by name"};
  const g = {};
  recs.forEach(r => { const k = r.source + "|" + r.match_status; (g[k] ||= {r, n: 0}).n++; });
  return Object.values(g).map(({r, n}) => `<tr><td>${esc(r.label)} <span class="faint small">(${n})</span></td><td>${esc(M[r.match_status] || r.match_status)}
    ${r.match_status === "auto" ? `<div class="small faint">by ${esc((r.match_method || "").replace(" (via fallback)", "").replace(/_/g, " "))}</div>` : ""}</td></tr>`).join("");
}
function hoursTable(recs) {
  const rule = (CFG.parsed.rules || []).find(r => r.type === "aggregate_compare");
  if (!rule) return "";
  const A = rule.a, B = rule.b, unit = rule.unit || "", pre = rule.prefix || "";
  const per = {};
  recs.filter(r => r.source === A.source).forEach(r => { const k = r.norm[A.start] + "|" + r.norm[A.end]; (per[k] ||= {a: 0, b: 0, hasA: true}).a += +r.norm[A.measure] || 0; });
  const bRecs = recs.filter(r => r.source === B.source);
  if (!Object.keys(per).length && !bRecs.length) return "";
  Object.keys(per).forEach(k => { const [s, t] = k.split("|"); bRecs.forEach(r => { const d = r.norm[B.date]; if (d >= s && d <= t) { per[k].b += +r.norm[B.measure] || 0; per[k].hasB = true; } }); });
  const only = bRecs.filter(r => +r.norm[B.measure] && !Object.keys(per).some(k => { const [s, t] = k.split("|"); return r.norm[B.date] >= s && r.norm[B.date] <= t; }));
  if (only.length) { const ds = only.map(r => r.norm[B.date]).sort(); per[ds[0] + "|" + ds[ds.length - 1]] = {a: 0, b: only.reduce((x, r) => x + (+r.norm[B.measure] || 0), 0), hasB: true}; }
  const q = n => pre + num(n) + unit;
  const av = A.verb || LABELS[A.source], bv = B.verb || LABELS[B.source];
  return `<h3>${esc(av)} vs ${esc(bv.toLowerCase())}</h3><div class="tbl"><table><tr><th>Period</th><th>${esc(av)}</th><th>${esc(bv)}</th><th></th></tr>
    ${Object.entries(per).sort().map(([k, v]) => { const [s, t] = k.split("|"); const diff = v.a - v.b;
      return `<tr><td>${shortDate(s)} – ${shortDate(t)}</td><td>${v.hasA ? q(v.a) : `<span class="faint">—</span>`}</td><td>${v.hasB ? q(v.b) : `<span class="faint">—</span>`}</td>
        <td class="small">${!v.hasB ? "" : Math.abs(diff) <= (rule.tolerance || 0) ? `<span style="color:var(--green)">Matches</span>` : `<span style="color:var(--amber)">${q(Math.abs(diff))} ${diff > 0 ? "more" : "less"} ${esc(av.toLowerCase())}</span>`}</td></tr>`; }).join("")}
    </table></div>`;
}

/* ============================================================ PEOPLE */
routes.people = async () => {
  if (!S.records) return emptyState();
  const [ents, issues] = await Promise.all([wapi("/entities"), wapi("/issues?status=open")]);
  const byEnt = {};
  issues.forEach(i => { if (i.severity === "info") return; (byEnt[i.entity_key] ||= []).push(i); (i.data.related || []).forEach(k => (byEnt[k] ||= []).push(i)); });
  const cols = CFG.parsed.entity.columns || Object.keys(CFG.parsed.attributes).filter(a => a !== "name").slice(0, 3);
  const rank = e => { const l = byEnt[e.key] || []; return l.some(i => i.severity === "critical") ? 0 : l.length ? 1 : 2; };
  const rows = [...ents].sort((a, b) => rank(a) - rank(b) || a.display_name.localeCompare(b.display_name));
  $("#main").innerHTML = `<h1>${esc(S.entity_label)}s</h1>
    <p class="lead">One profile per ${esc(S.entity_label.toLowerCase())}, combined from all your systems. Click a name to compare what each system says.</p>
    <div class="row" style="margin:18px 0 12px"><input id="q" placeholder="Search by name…" style="width:280px"><span class="spacer"></span><a class="btn small quiet" href="/api/w/${WS}/export/entities.csv">Download as CSV</a></div>
    <div class="tbl"><table id="pt"><tr><th>Name</th>${cols.map(c => `<th>${esc(attrName(c))}</th>`).join("")}<th>Status</th></tr>
      ${rows.map(e => { const l = byEnt[e.key] || []; const r = rank(e);
        return `<tr class="click" data-person="${esc(e.key)}" data-s="${esc(e.display_name.toLowerCase() + " " + e.key.toLowerCase())}">
        <td>${esc(e.display_name)}${e.status !== "verified" ? `<div class="small muted">Not on the ${esc(ANCHOR)}</div>` : ""}</td>
        ${cols.map(c => `<td>${esc(val((e.attrs[c] || {}).value))}</td>`).join("")}
        <td><span class="row" style="gap:8px"><span class="dot ${["d-red", "d-amber", "d-green"][r]}"></span>${r === 2 ? "All good" : plural(l.length, "thing") + " to check"}</span></td></tr>`; }).join("")}
    </table></div>`;
  bindActions($("#main"));
  $("#q").oninput = ev => { const q = ev.target.value.toLowerCase(); document.querySelectorAll("#pt tr[data-s]").forEach(tr => tr.style.display = tr.dataset.s.includes(q) ? "" : "none"); };
};

routes.system = async () => {

    const ren = Object.entries(n.mapping || {}).filter(([f, h]) => f !== h);
    return [ren.length ? "Renamed: " + ren.map(([f, h]) => `"${esc(h)}" → ${esc(f)}`).join(", ") : "All columns recognised",
            (n.missing_fields || []).length ? `Missing: ${n.missing_fields.map(esc).join(", ")}` : "",
            (n.unmapped_columns || []).length ? `Extra columns kept: ${n.unmapped_columns.map(esc).join(", ")}` : ""].filter(Boolean).join(" · ");

    <h2>Which system we trust for what</h2>

      ${Object.entries(p.attributes).map(([a, s]) => `<tr><td>${esc(attrName(a))}</td><td class="muted">${Object.keys(s.from).map(k => esc(LABELS[k] || k)).join(", ")}</td>

      ${rules.map(r => `<tr style="${r.active ? "" : "color:var(--faint)"}"><td>${esc(r.label)}</td><td class="small">${esc(r.created_by || "Reviewer")}<div class="faint">${esc(when(r.created_at))}</div></td>
        <td>${r.active ? r.applied : "off"}</td><td>${r.active ? `<button class="btn small quiet danger" data-rule-off="${r.id}">Switch off</button>` : ""}</td></tr>`).join("")}</table></div>`

    <h2>Your data as tables</h2>

  $("#resetup").onclick = async () => { toast("Reading this company's current files…"); await wpost("/setup/from-current"); go("setup"); };
  bindFiles($("#main"));
  $("#reset").onclick = async () => { const b = $("#reset"); if (!b.dataset.armed) { b.dataset.armed = 1; b.textContent = "Click again to erase everything"; return; } await wpost("/reset"); toast("Cleared"); go(""); refresh(); };
};

/* ============================================================ GUIDED SETUP */
let SETUP = null;
async function setupPage(info) {
  $("#client").textContent = info.name;
  SETUP = await wapi("/setup");
  DROP = files => setupFiles(files, info);
  renderSetup(info);
}
async function setupFiles(files, info) {
  if (!files.length) return;
  const fd = new FormData(); [...files].forEach(f => fd.append("files", f));
  toast("Looking at your files…");
  SETUP = await api(`/api/w/${WS}/setup/files`, {method: "POST", body: fd});
  renderSetup(info);
}
function setupUpload(info) {
  const inp = document.createElement("input"); inp.type = "file"; inp.multiple = true;
  inp.onchange = () => setupFiles(inp.files, info);
  inp.click();
}
function renderSetup(info) {
  const ch = SETUP.choices, P = Object.fromEntries((SETUP.profiles || []).map(p => [p.sid, p]));
  const filesHtml = (SETUP.profiles || []).map(p => `<div class="file" style="grid-template-columns:20px 1fr auto auto">
      <span class="dot d-green"></span><span><b>${esc(p.filename)}</b> <span class="muted small">· ${p.rows} rows · ${p.columns.length} columns</span></span>
      <span class="small muted">${ch && ch.master === p.sid ? "master list" : ""}</span>
      <button class="btn small quiet danger" data-unstage="${esc(p.filename)}">Remove</button></div>`).join("")
    + (SETUP.skipped || []).map(x => `<div class="file" style="grid-template-columns:20px 1fr"><span class="dot d-amber"></span><span><b>${esc(x.filename)}</b> <span class="small muted">· skipped: ${esc(x.reason)}</span></span></div>`).join("");
  let html = `<h1>Set up ${esc(info.name)}</h1>
    <p class="lead">Add an export from each system this company uses. We'll look at the columns and values, suggest how everything fits together, and you confirm it.</p>
    <div class="step"><div class="n">1</div><div><h2>Add the files</h2><div class="sub">CSV, Excel or PDF (tables and printed schedules). One file per system: HR, CRM, billing, inventory, anything.</div></div></div>
    <div class="files">${filesHtml || `<div class="empty">No files yet. Drop them anywhere on this page.</div>`}
      <div class="file" style="grid-template-columns:1fr auto"><span class="muted small">You can drag files onto the page too.</span><button class="btn small primary" id="addsetup">Add files</button></div></div>`;
  if (ch) {
    const srcs = ch.sources, label = id => srcs[id] ? srcs[id].label : id, ent = ch.entity_label;
    const col = (sid, f) => { const c = (P[sid] || {columns: []}).columns.find(c => c.field === f); return c ? c.header : f; };
    const master = P[ch.master];
    html += `
    <div class="step"><div class="n">2</div><div><h2>What is this about?</h2><div class="sub">The master list is the file with one row per real thing. Everything else gets matched to it.</div></div></div>
    <div class="choice">
      <div class="row"><span>Master list</span><select id="smaster">${SETUP.profiles.map(p => `<option value="${p.sid}" ${p.sid === ch.master ? "selected" : ""}>${esc(p.filename)}</option>`).join("")}</select>
        <span>· each row is a</span><input id="sent" value="${esc(ent)}" style="width:150px">
        <span>· identified by</span><select id="skey">${master.columns.map(c => `<option value="${c.field}" ${c.field === ch.key ? "selected" : ""}>${esc(c.header)}</option>`).join("")}</select></div>
      <div class="why" style="margin-top:8px">${master.name_spec ? `Names come from <b>${esc(Object.values(master.name_spec).map(f => col(master.sid, f)).join(" + "))}</b>.` : "No name column found; records are matched by ID only."}</div>
    </div>

    <div class="step"><div class="n">3</div><div><h2>How the other files connect</h2><div class="sub">We compared actual values between files to find these links.</div></div></div>
    ${Object.entries(srcs).filter(([sid]) => sid !== ch.master).map(([sid, s]) => `<div class="choice">
      <div class="row"><label style="margin:0"><input type="checkbox" data-sinc="${sid}" ${s.include ? "checked" : ""}> <b>${esc(s.filename)}</b></label>
        <span class="muted small">called</span><input data-slabel="${sid}" value="${esc(s.label)}" style="width:180px;padding:3px 8px">
        <span class="small muted">· ${s.kind === "activity" ? `a log of activity (several rows per ${esc(ent.toLowerCase())})` : `one row per ${esc(ent.toLowerCase())}`}</span></div>
      ${s.links.length ? s.links.map((l, i) => `<label><input type="checkbox" data-link="${sid}|${i}" ${l.use ? "checked" : ""}>
          <span>${l.type === "key" ? `Same <b>${esc(col(sid, l.column))}</b> as <b>${esc(col(ch.master, l.master_column))}</b> in ${esc(label(ch.master))}`
                                     : `Same name (<b>${esc(col(sid, l.column))}</b>)`}
          <span class="why">· ${Math.round(l.score * 100)}% of values match</span></span></label>`).join("")
        : `<div class="why" style="margin-top:8px">We couldn't find anything linking this file to ${esc(label(ch.master))}. It will be loaded, but its rows won't be matched to anyone.</div>`}
    </div>`).join("")}

    <div class="step"><div class="n">4</div><div><h2>Fields to compare</h2><div class="sub">When a field appears in more than one file, we'll flag disagreements. Pick which file to trust for each.</div></div></div>
    <div class="tbl"><table><tr><th></th><th>Field</th><th>Found in</th><th>Trust</th></tr>
      ${ch.attributes.map((a, i) => { const ss = Object.keys(a.cols); return `<tr><td><input type="checkbox" data-ainc="${i}" ${a.include ? "checked" : ""}></td>
        <td>${esc(attrName(a.name))}</td>
        <td class="small">${ss.map(s => `${esc(label(s))}: <span class="muted">${esc(a.cols[s] === "_name" ? "name" : col(s, a.cols[s]))}</span>`).join("<br>")}</td>
        <td>${ss.length > 1 ? `<select data-auth="${i}">${ss.map(s => `<option value="${s}" ${s === a.authority ? "selected" : ""}>${esc(label(s))}</option>`).join("")}</select>` : `<span class="faint small">only one file</span>`}</td></tr>`; }).join("")}
    </table></div>

    <div class="step"><div class="n">5</div><div><h2>Checks to run</h2><div class="sub">Suggested from your columns. Untick anything you don't need.</div></div></div>
    <div class="choice">${ch.rules.length ? ch.rules.map((r, i) => {
        const num = r.warn_days != null ? ["warn_days", r.warn_days] : r.max_age_days != null ? ["max_age_days", r.max_age_days] : null;
        let text = esc(r.explain || r.id);
        if (num) text = text.replace(`{${num[0]}}`, `<input type="number" data-rnum="${i}|${num[0]}" value="${num[1]}" style="width:70px;padding:1px 6px">`);
        return `<label><input type="checkbox" data-rinc="${i}" ${r.include ? "checked" : ""}><span>${text}</span></label>`; }).join("")
      : `<div class="why">No checks suggested. Field comparisons above still run.</div>`}</div>

    <div class="sticky-save row"><button class="btn primary" id="ssave" style="padding:9px 18px">Save and build the source of truth</button>
      <span class="muted small">You can change any of this later from "How it works".</span>
      <span class="spacer"></span>${info.configured ? `<a id="scancel">Cancel</a>` : ""}</div>`;
  }
  $("#main").innerHTML = html;
  $("#addsetup").onclick = () => setupUpload(info);
  $("#main").querySelectorAll("[data-unstage]").forEach(b => b.onclick = async () => { SETUP = await post(`/api/w/${WS}/setup/remove/${encodeURIComponent(b.dataset.unstage)}`); renderSetup(info); });
  if (!ch) return;
  $("#smaster").onchange = async e => { toast("Re-checking links around the new master list…"); SETUP = await post(`/api/w/${WS}/setup/master`, {master: e.target.value}); renderSetup(info); };
  $("#sent").oninput = e => ch.entity_label = e.target.value || "Record";
  $("#skey").onchange = e => ch.key = e.target.value;
  const q = sel => $("#main").querySelectorAll(sel);
  q("[data-sinc]").forEach(x => x.onchange = () => ch.sources[x.dataset.sinc].include = x.checked);
  q("[data-slabel]").forEach(x => x.oninput = () => ch.sources[x.dataset.slabel].label = x.value);
  q("[data-link]").forEach(x => x.onchange = () => { const [sid, i] = x.dataset.link.split("|"); ch.sources[sid].links[+i].use = x.checked; });
  q("[data-ainc]").forEach(x => x.onchange = () => ch.attributes[+x.dataset.ainc].include = x.checked);
  q("[data-auth]").forEach(x => x.onchange = () => ch.attributes[+x.dataset.auth].authority = x.value);
  q("[data-rinc]").forEach(x => x.onchange = () => ch.rules[+x.dataset.rinc].include = x.checked);
  q("[data-rnum]").forEach(x => { x.onclick = e => e.preventDefault(); x.onchange = () => { const [i, k] = x.dataset.rnum.split("|"); ch.rules[+i][k] = +x.value; }; });
  if ($("#scancel")) $("#scancel").onclick = () => go("");
  $("#ssave").onclick = async () => {
    $("#ssave").disabled = true; $("#ssave").textContent = "Building…";
    try { await post(`/api/w/${WS}/setup/save`, {choices: ch}); CFG = null; toast("Saved. Here's what we found."); go(""); }
    catch (err) { toast(esc(err.message)); $("#ssave").disabled = false; $("#ssave").textContent = "Save and build the source of truth"; }
  };
}

function totCard(g, i) {
  return `<div class="card sum" data-open="tot" data-arg="${i}"><div class="label">${esc(g.label)}</div>
    <div class="big">${g.mismatched ? g.mismatched : "All match"}${g.mismatched ? ` <span style="font-size:20px;color:var(--muted);font-weight:500">of ${g.total}</span>` : ""}</div>
    <div class="says">${g.mismatched ? `don't match between ${esc(g.a_label)} and ${esc(g.b_label)}.` : `${esc(g.a_label)} and ${esc(g.b_label)} agree.`}</div>
    <div class="go">See the totals →</div></div>`;
}
DRAWERS.exp = async (i) => {
  const g = (await wapi("/views/expiring")).groups[+i || 0];
  const sec = (st, title) => { const rows = g.rows.filter(r => r.status === st); return rows.length ? `<h3>${title} <span class="faint" style="font-weight:400">${rows.length}</span></h3>
    <div class="tbl"><table><tr><th>${esc(S.entity_label)}</th><th>Date</th><th></th></tr>${rows.map(r => `<tr class="click" data-person="${esc(r.entity_key)}"><td>${esc(r.name)}</td>
      <td>${esc(val(r.date))}${r.disputed ? ` <span class="tag red">systems disagree</span>` : ""}</td><td class="muted small">${r.days_left < 0 ? -r.days_left + " days ago" : "in " + r.days_left + " days"}</td></tr>`).join("")}</table></div>` : ""; };
  openDrawer(`<h1>${esc(g.label)}</h1><div class="muted">Checked as of ${esc(val(S.as_of))}.</div>`,
    sec("expired", "Expired") + sec("soon", `Within ${g.warn_days} days`) + sec("ok", "Fine"), () => DRAWERS.exp(i));
};
DRAWERS.tot = async (i) => {
  const g = (await wapi("/views/totals")).groups[+i || 0];
  const q = n => g.prefix + num(n) + g.unit;
  openDrawer(`<h1>${esc(g.label)}</h1><div class="muted">Totals per ${esc(S.entity_label.toLowerCase())} and period. Rows that don't match are on your to-do list.</div>`,
    `<div class="tbl"><table><tr><th>${esc(S.entity_label)}</th><th>Period</th><th>${esc(g.a_label)}</th><th>${esc(g.b_label)}</th><th></th></tr>
      ${g.rows.map(r => `<tr class="click" data-person="${esc(r.entity_key)}"><td>${esc(r.name)}</td><td class="small">${shortDate(r.period_start)} – ${shortDate(r.period_end)}</td>
        <td>${q(r.a)}</td><td>${q(r.b)}</td><td>${r.ok ? `<span class="tag green">Match</span>` : `<span class="tag amber">${r.diff > 0 ? "+" : "−"}${q(Math.abs(r.diff))}</span>`}</td></tr>`).join("")}</table></div>`,
    () => DRAWERS.tot(i));
};
async function tableDrawer(name) {
  const t = await wapi(`/tables/${encodeURIComponent(name)}?limit=200`);
  openDrawer(`<h1 class="mono" style="font-size:20px">${esc(name)}</h1><div class="muted">First ${t.rows.length} rows. Read-only.</div>`,
    `<div class="tbl"><table><tr>${t.columns.map(c => `<th>${esc(c)}</th>`).join("")}</tr>
      ${t.rows.map(r => `<tr>${r.map(v => `<td class="small">${esc(v ?? "")}</td>`).join("")}</tr>`).join("")}</table></div>`);
}

/* ============================================================ learn from a decision */
async function offerRule(id, action) {
  let sim;
  try { sim = await wapi(`/issues/${id}/similar`); }
  catch (err) { toast("Rules aren't available yet. Restart the server and reload the page."); return; }
  if (!sim.allowed) { toast(esc(sim.reason || "This issue can't be turned into a rule.")); return; }
  const opts = sim.options;
  if (!opts.length) return;
  document.querySelectorAll(".offer").forEach(x => x.remove());
  const el = document.createElement("div"); el.className = "offer";
  el.innerHTML = `<h3>Handle similar issues the same way?</h3>
    <div class="muted small">Save this as a rule. Matching issues, now and in future uploads, will be resolved automatically and marked with the rule. You can undo any of them.</div>
    ${opts.map((o, k) => `<label><input type="radio" name="ruleopt" value="${k}" ${k === opts.length - 1 && o.condition ? "checked" : k === 0 ? "checked" : ""}>
      <span>${esc(o.label)} <span class="faint">(${o.count ? o.count + " more open now" : "none open now, applies to future uploads"})</span></span></label>`).join("")}
    <div class="row" style="margin-top:12px"><button class="btn primary small" id="mkrule">Make it a rule</button><button class="btn small quiet" id="norule">Just this one</button></div>`;
  document.body.appendChild(el);
  // prefer the narrowest suggestion (a condition) when one exists
  let narrow = opts.findIndex(o => o.condition && o.count >= 1);
  if (narrow < 0) narrow = opts.findIndex(o => o.count >= 1);
  if (narrow >= 0) el.querySelectorAll("input")[narrow].checked = true;
  el.querySelector("#norule").onclick = () => el.remove();
  el.querySelector("#mkrule").onclick = async () => {
    const k = +el.querySelector("input:checked").value;
    el.querySelector("#mkrule").disabled = true;
    const before = S.open_issues;
    await wpost("/auto-rules", {issue_id: +id, condition: opts[k].condition, action, reviewer: reviewer || null});
    el.remove(); await refresh();
    toast(`Rule saved. ${Math.max(0, before - S.open_issues)} more issue(s) resolved automatically.`);
  };
}
